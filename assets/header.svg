<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="265" viewBox="0 0 1100 265" role="img" aria-labelledby="title description">
    <title id="title">Mythica123</title>
    <desc id="description">A midnight-blue developer profile banner with violet typography, a crescent moon, stars, and a subtle terminal motif.</desc>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#080D19"/>
            <stop offset="55%" stop-color="#10152B"/>
            <stop offset="100%" stop-color="#1B1640"/>
        </linearGradient>

        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#C4B5FD"/>
            <stop offset="100%" stop-color="#818CF8"/>
        </linearGradient>

        <radialGradient id="glow">
            <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
        </radialGradient>

        <clipPath id="rounded">
            <rect x="1" y="1" width="1098" height="263" rx="14"/>
        </clipPath>
    </defs>

    <g clip-path="url(#rounded)">
        <!-- Background -->
        <rect width="1100" height="265" fill="url(#bg)"/>
        <circle cx="880" cy="100" r="260" fill="url(#glow)"/>

        <!-- Subtle Terminal Grid -->
        <g stroke="#A78BFA" stroke-opacity="0.045" stroke-width="1">
            <path d="M0 50H1100 M0 100H1100
                    M0 150H1100 M0 200H1100"/>
            <path d="M100 0V265 M200 0V265
                    M300 0V265 M400 0V265
                    M500 0V265 M600 0V265
                    M700 0V265 M800 0V265
                    M900 0V265 M1000 0V265"/>
        </g>

        <!-- Stars -->
        <g fill="#C4B5FD">
            <circle cx="620" cy="49" r="1.5" opacity="0.7"/>
            <circle cx="685" cy="103" r="1" opacity="0.5"/>
            <circle cx="758" cy="33" r="1.8" opacity="0.8"/>
            <circle cx="935" cy="43" r="1.2"/>
            <circle cx="1020" cy="91" r="1.5" opacity="0.6"/>   
            <circle cx="980" cy="173" r="1" opacity="0.6"/>
            <circle cx="570" cy="195" r="1.3"/>
            <circle cx="719" cy="210" r="1" opacity="0.6"/>
            <path d="M700 65v12 M694 71h12" stroke="#A78BFA" stroke-width="1.3"/>
            <path d="M1030 133v10 M1025 138h10" stroke="#C4B5FD" stroke-width="1"/>
        </g>

        <!-- Crescent Moon -->
        <circle cx="867" cy="91" r="35" fill="#DDD6FE"/>
        <circle cx="881" cy="77" r="35" fill="#131631"/>

        <!-- Skyline -->
        <g fill="#0B1021" opacity="0.9">
            <path d="M625 265V216h26v-17h27v66Z"/>
            <path d="M678 265V230h36v-38h30v73Z"/>
            <path d="M745 265V212h47v53Z"/>
            <path d="M793 265V232h35v-46h30v79Z"/>
            <path d="M860 265V214h43v51Z"/>
            <path d="M907 265V237h36v-29h39v57Z"/>
            <path d="M984 265V221h54v44Z"/>
        </g>

        <!-- Skyline Windows -->
        <g fill="#A78BFA" opacity="0.45">
            <rect x="693" y="241" width="3" height="5"/>
            <rect x="705" y="241" width="3" height="5"/>
            <rect x="760" y="226" width="3" height="5"/>
            <rect x="774" y="226" width="3" height="5"/>
            <rect x="809" y="224" width="3" height="5"/>
            <rect x="841" y="205" width="3" height="5"/>
            <rect x="875" y="234" width="3" height="5"/>
            <rect x="928" y="245" width="3" height="5"/>
            <rect x="958" y="223" width="3" height="5"/>
            <rect x="1002" y="240" width="3" height="5"/>
        </g>

        <!-- Main title -->
        <text x="66" y="108" font-family="Georgia, serif" font-size="62" fill="url(#accent)">Mythica123</text>

        <!-- Command -->
        <text x="69" y="149" font-family="monospace" font-size="17" letter-spacing="0.5" fill="#C4B5FD">./build | explore | create | repeat</text>

        <!-- Divider-->
        <path d="M69 174H118" stroke="#A78BFA" stroke-width="2"/>

        <!-- Description -->
        <text x="69" y="209" font-family="monospace" font-size="15" fill="#A7A9C9">Somewhere between logic and imagination</text>

        <!-- Terminal Decoration -->
        <g font-family="monospace" font-size="14" fill="#A78BFA" opacity="0.75">
            <text x="962" y="44">_</text>
        </g>
    </g>

    <!-- Outer Border -->
    <rect x="1" y="1" width="1098" height="263" rx="14" fill="none" stroke="#514878" stroke-width="1"/>
</svg>